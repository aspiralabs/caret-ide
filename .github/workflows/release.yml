name: Release

# Runs when you push a version tag like `v0.1.0` (see RELEASING.md).
# Builds the unsigned arm64 .dmg on a macOS Apple-Silicon runner and uploads it
# to a single GitHub Release (draft). It's created as a DRAFT, so nothing goes
# public until you review it and click "Publish release".
on:
  push:
    tags:
      - 'v*'
  # Lets you trigger a build manually from the Actions tab (no release upload,
  # since there's no tag to name the release after — use it to test the build).
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create the release + upload assets.
permissions:
  contents: write

jobs:
  release-mac:
    # macos-14 is an Apple-Silicon (arm64) runner, so node-pty + the app build
    # natively for arm64 without cross-compilation.
    runs-on: macos-14
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # Full history + tags so we can diff against the previous tag when
          # building the changelog below.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` also runs the postinstall (electron-rebuild) that rebuilds
      # node-pty against Electron's ABI — required for the terminal to work.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Build the .dmg WITHOUT publishing. We deliberately don't let
      # electron-builder create the GitHub release: its draft publisher can race
      # and create duplicate drafts (splitting the .dmg from its .blockmap). The
      # upload is handled in one shot by the next step instead.
      - name: Build arm64 .dmg
        run: |
          npm run build
          npx electron-builder --mac --publish never

      # Build the release notes: the standing install note followed by a
      # changelog of the actual commits since the previous tag. We generate the
      # list from `git log` (not GitHub's auto-notes, which only list merged
      # PRs — useless when we push straight to main). The bare `X.Y.Z` version-
      # bump commit from `npm version` is filtered out as noise.
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..${CURRENT_TAG}"; else RANGE="${CURRENT_TAG}"; fi
          COMMITS=$(git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" \
            | grep -vE '^- [0-9]+\.[0-9]+\.[0-9]+ \([0-9a-f]+\)$' || true)
          {
            echo "**Apple Silicon (arm64), unsigned.** On first launch, right-click **Caret.app** → **Open** → **Open**, or run:"
            echo '`xattr -dr com.apple.quarantine /Applications/Caret.app`'
            echo ""
            echo "---"
            echo ""
            echo "## What's Changed"
            echo ""
            echo "${COMMITS:-_No notable changes._}"
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            fi
          } > release-notes.md

      # Create (or update) exactly ONE release for this tag and attach the .dmg.
      # Idempotent per tag, so re-running never produces duplicates.
      - name: Publish draft release with the .dmg
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap

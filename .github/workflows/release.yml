name: Release

# Runs when you push a version tag like `v0.1.0` (see RELEASING.md).
# Builds the unsigned arm64 .dmg on a macOS Apple-Silicon runner and publishes it
# to a GitHub Release. electron-builder creates the release as a DRAFT by default,
# so nothing goes public until you review it and click "Publish release".
on:
  push:
    tags:
      - 'v*'
  # Lets you trigger a build manually from the Actions tab without a tag.
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create the release + upload assets.
permissions:
  contents: write

jobs:
  release-mac:
    # macos-14 is an Apple-Silicon (arm64) runner, so node-pty + the app build
    # natively for arm64 without cross-compilation.
    runs-on: macos-14
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` also runs the postinstall (electron-rebuild) that rebuilds
      # node-pty against Electron's ABI — required for the terminal to work.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build & publish arm64 .dmg to a GitHub Release (draft)
        env:
          # electron-builder reads GH_TOKEN to create the release + upload assets.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:mac
